<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="activity3.css" />
  </head>

  <body>
    <div class="formBox">
      <h1>Student Registration Form</h1>

      <form>
        <div class="rollNo:">
          <label>Roll no.:</label>
          <input type="text" /> <br />
        </div>

        <div class="studentName">
          <label>Student name:</label>
          <input type="text" placeholder="First name" />
          <input type="text" placeholder="Last name" /> <br />
        </div>

        <div class="fathersName">
          <label>Father's name:</label>
          <input type="text" placeholder="First name" />
          <input type="text" placeholder="Last name" /><br />
        </div>

        <div class="mothersName">
          <label>Mother's name:</label>
          <input type="text" placeholder="First name" />
          <input type="text" placeholder="Last name" /><br />
        </div>

        <div class="Birth">
          <label>Date of Birth</label>
          <input type="text" placeholder="DD-MM-YYYY" /> <br />
        </div>

        <div class="mobileNo.">
          <label>Mobile no.</label>
          <input type="text" placeholder="+63" /><br />
        </div>

        <div class="emailId">
          <label>Email Id</label>
          <input type="text" placeholder="Email" /><br />
        </div>

        <div class="Password">
          <label>Password</label>
          <input type="text" placeholder="password" /><br />
        </div>

        <div class="Gender">
          <label>Gender</label>
          <input type="radio" name="Gender" />Male
          <input type="radio" name="Gender" />Female
          <br />
        </div>

        <div class="Department">
          <label>Department</label>
          <input type="checkbox" name="Department" />CSE
          <input type="checkbox" name="Department" />IT
          <input type="checkbox" name="Department" />ECE
          <input type="checkbox" name="Department" />CIVIL
          <br />
        </div>

        <div class="Course">
          <label>Course</label>
          <select>
            <option>Select Current</option>
            <option>BSIT</option>
            <option>BSCS</option>
            <option>BSE</option>
          </select>
          <br />
        </div>

        <div class="City">
          <label>City:</label>
          <input type="text" /><br />
        </div>

        <div class="Address">
          <label>Address:</label>
          <input type="text" /><br />
        </div>

        <br />
        <button type="submit">Register</button>
      </form>
    </div>
  </body>
</html>
